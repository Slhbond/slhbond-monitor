# ==========================================================================
# Slhbond-Monitor 配置文件
#   格式：每行一条 `键 = 值`，以 # 或 ; 开头的行是注释。
#   优先级：内置默认值 < 本文件 < 命令行参数。
#   修改后重启服务生效： systemctl restart slhbond-monitor
#
#   本文件由 deploy.sh 安装：其中的 @PREFIX@ / @PORT@ / @STATE_DIR@
#   会在安装时被替换成实际路径，请不要手动改回占位符以外的写法。
# ==========================================================================

# ------------------------------------------------------------------ 监听
# 监听地址。0.0.0.0 表示局域网内均可访问；只想本机访问就改成 127.0.0.1。
bind = 0.0.0.0

# 监听端口。
port = @PORT@

# 处理请求的工作线程数。监控面板访问量很小，4 个足够。
workers = 4

# -------------------------------------------------------------- 静态资源
# 前端文件（index.html / style.css / app.js）所在目录。
doc_root = @PREFIX@/web

# 小份持久状态目录（记录哪些硬盘已做过首次自动健康检测，以及检测结论）。
# 必须对服务账号可写：用 systemd 运行时，单元里的 StateDirectory= 会创建并授权
# /var/lib/slhbond-monitor，所以保持默认即可。
state_dir = @STATE_DIR@

# ------------------------------------------------------------------ 日志
# 同时把日志写入文件；留空则只输出到标准错误（由 systemd 收集）。
# 注意：使用 systemd 时建议留空，用 journalctl -u slhbond-monitor 查看。
log_file =

# 日志级别：error | warn | info | debug
log_level = info

# ------------------------------------------------------------ 面板行为
# 下发给前端的轮询间隔（毫秒），决定面板多久刷新一次。
poll_ms = 5000

# 服务端系统信息缓存时长（毫秒）。避免多个客户端频繁读取 /proc。
# 设为 0 表示每次都重新采集。
cache_ms = 900

# ------------------------------------------------------------ 更新检查
# 是否检查新版本。关闭后前端不会出现「更新可用」按钮。
update_check = true

# 版本清单位置。可以是本地文件路径，也可以是 http:// 或 https:// 地址。
# 放在 GitHub 上就用 raw 地址，例如：
#   update_manifest = https://raw.githubusercontent.com/你的用户名/slhbond-monitor/main/update.json
#
# 清单格式（JSON，sha256 与 size 强烈建议填，更新前会校验摘要）：
#   {
#     "version": "1.21",
#     "url":     "https://github.com/.../releases/download/v1.21/slhbond-monitor-1.21.tar.gz",
#     "sha256":  "发布包的 SHA-256",
#     "size":    5400000,
#     "notes":   "这次改了什么"
#   }
#
# 当清单里的 version 高于当前编译版本时，面板出现蓝色「更新可用」按钮；
# 点它会下载、校验、解包，再由 slhbond-update.timer 以 root 身份应用。
# 注意 https 需要系统装有 curl 或 wget（项目本身不链接 TLS 库）。
update_manifest = @PREFIX@/update.json

# 检查间隔（秒）。到点自动查一次，与下面的每日检查互不冲突。
update_interval = 1800

# 每天几点再固定检查一次（0-23，0 = 凌晨 0 点；-1 = 关闭）。
# 面板上版本号下面有「检查版本」按钮，可以随时手动查；
# 这里是无人值守时的自动检查，两者走同一条代码路径。
# 注意：这里用的是设备本地时间，改时区后会跟着变。
update_daily_hour = 0

# ------------------------------------------------------- 每秒历史（溯源）
# 是否把每秒的硬件快照写入本地磁盘。关掉后「溯源记录」方块会一直是 0。
history = true

# 保留多久的历史（小时）。每条记录 32 字节 + 每核 1 字节，
# 4 核机器上 24 小时约 3 MB —— 这是磁盘占用的唯一调节项。
history_hours = 24

# 采样间隔（秒）。1 = 每秒一条。
history_interval = 1

# 攒够多少条才写一次盘。值越大越省闪存寿命，但断电时丢失的窗口也越长。
history_flush = 60

# 每条记录保存几个核的逐核数据，0 = 跟随检测到的核数（上限 16）。
history_cores = 0

# ------------------------------------------------------------ 告警阈值
# 任一指标连续超过阈值达到 alert_hold_sec 秒，就自动记录一条超限记录。
# 这些值也可以点面板上的「警告」方块直接修改，面板写入的会覆盖这里。
alert_cpu_percent = 90
alert_mem_percent = 90
alert_temp_c = 80          # CPU 温度
alert_gpu_percent = 90     # GPU 活跃度（panfrost 只报上电占比，不是利用率）
alert_npu_percent = 90     # NPU 负载（驱动未加载时不参与判断）
alert_disk_temp_c = 55     # 硬盘温度，取所有盘里最热的一块
alert_hold_sec = 10

# 前台运行（调试用；systemd 单元已显式传入 --foreground）。
# foreground = true
