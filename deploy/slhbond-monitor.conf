# ==========================================================================
# Slhbond-Monitor 配置文件
#   格式：每行一条 `键 = 值`，以 # 或 ; 开头的行是注释。
#   优先级：内置默认值 < 本文件 < 命令行参数。
#   修改后重启服务生效： systemctl restart slhbond-monitor
#
#   本文件由 deploy.sh 安装：其中的 @PREFIX@ / @PORT@ / @STATE_DIR@
#   会在安装时被替换成实际路径，请不要手动改回占位符以外的写法。
# ==========================================================================

# ------------------------------------------------------------------ 监听
# 监听地址。0.0.0.0 表示局域网内均可访问；只想本机访问就改成 127.0.0.1。
bind = 0.0.0.0

# 监听端口。
port = @PORT@

# 处理请求的工作线程数。监控面板访问量很小，4 个足够。
workers = 4

# -------------------------------------------------------------- 静态资源
# 前端文件（index.html / style.css / app.js）所在目录。
doc_root = @PREFIX@/web

# 小份持久状态目录（记录哪些硬盘已做过首次自动健康检测，以及检测结论）。
# 必须对服务账号可写：用 systemd 运行时，单元里的 StateDirectory= 会创建并授权
# /var/lib/slhbond-monitor，所以保持默认即可。
state_dir = @STATE_DIR@

# ------------------------------------------------------------------ 日志
# 同时把日志写入文件；留空则只输出到标准错误（由 systemd 收集）。
# 注意：使用 systemd 时建议留空，用 journalctl -u slhbond-monitor 查看。
log_file =

# 日志级别：error | warn | info | debug
log_level = info

# ------------------------------------------------------------ 面板行为
# 下发给前端的轮询间隔（毫秒），决定面板多久刷新一次。
poll_ms = 5000

# 服务端系统信息缓存时长（毫秒）。避免多个客户端频繁读取 /proc。
# 设为 0 表示每次都重新采集。
cache_ms = 900

# ------------------------------------------------------------ 更新检查
# 是否检查新版本。关闭后前端不会出现「更新可用」按钮。
update_check = true

# 版本清单位置，可以是本地文件路径或 http:// 地址。
# 清单格式（JSON）：{"version":"1.1.0","url":"...","notes":"..."}
# 当清单里的 version 高于当前编译版本时，前端显示蓝色「更新可用」按钮。
# 留空即等于关闭检查。
update_manifest = @PREFIX@/update.json

# 检查间隔（秒）。
update_interval = 1800

# 前台运行（调试用；systemd 单元已显式传入 --foreground）。
# foreground = true
